<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const PIN_KEY="vl_pin_v3";
const today=()=>new Date().toISOString().split("T")[0];
const thisMonthKey=()=>new Date().toISOString().slice(0,7);
const CURRENCIES={USD:{symbol:"$",rate:1},INR:{symbol:"₹",rate:83.5},EUR:{symbol:"€",rate:0.92},GBP:{symbol:"£",rate:0.79}};
const fmt=(n,cur="USD")=>{const{symbol,rate}=CURRENCIES[cur]||CURRENCIES.USD;const v=(n||0)*rate;
  return`${symbol}${v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;};
const CATS=["Rent/Mortgage","Groceries","Dining Out","Transport","Utilities","Shopping","Gifts",
  "Entertainment","Subscriptions","Family","Medical","Travel","Crypto/Stocks","Other"];
const CAT_COLORS={"Rent/Mortgage":"#3b82f6","Groceries":"#22c55e","Dining Out":"#f59e0b","Transport":"#06b6d4",
  "Utilities":"#8b5cf6","Shopping":"#ec4899","Gifts":"#f97316","Entertainment":"#a855f7",
  "Subscriptions":"#ef4444","Family":"#14b8a6","Medical":"#e11d48","Travel":"#0ea5e9","Crypto/Stocks":"#84cc16","Other":"#64748b"};
const QUICK_DEFAULTS=[{icon:"🛒",label:"Groceries",cat:"Groceries"},{icon:"🍽",label:"Dining",cat:"Dining Out"},
  {icon:"⛽",label:"Fuel",cat:"Transport"},{icon:"🎁",label:"Gift",cat:"Gifts"},
  {icon:"💊",label:"Medical",cat:"Medical"},{icon:"✈️",label:"Travel",cat:"Travel"}];
const SHIP_STATUS=["Ordered","Shipped","In Transit","Delivered","Returned"];
const SHIP_COLORS={Ordered:C_AMBER,Shipped:"#3b82f6",["In Transit"]:"#a855f7",Delivered:"#22c55e",Returned:"#ef4444"};
const EMPTY={banks:[],cards:[],expenses:[],family:[],subs:[],investments:[],notes:[],
  gifts:[],debts:[],recurring:[],monthlySnapshots:[],currency:"USD",quickAdds:QUICK_DEFAULTS};

// colours — defined before use
var C_AMBER="#f59e0b"; // forward ref fix
const C={bg:"#0f1117",card:"#1a1d27",cardAlt:"#20243a",border:"#2a2e45",
  green:"#22c55e",red:"#ef4444",amber:"#f59e0b",blue:"#3b82f6",
  purple:"#a855f7",text:"#f1f5f9",muted:"#64748b",accent:"#7c3aed",sidebar:"#13151f"};

const useIsMobile=()=>{const[m,setM]=useState(window.innerWidth<768);
  useEffect(()=>{const h=()=>setM(window.innerWidth<768);window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);},[]);return m;};

// ── atoms ─────────────────────────────────────────────────────────────────────
const Card=({children,style={}})=><div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`,...style}}>{children}</div>;
const Tag=({label,color})=><span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,background:color+"22",color,letterSpacing:.5,whiteSpace:"nowrap"}}>{label}</span>;
const Pill=({active,onClick,children})=><button onClick={onClick} style={{padding:"6px 14px",borderRadius:99,border:"none",cursor:"pointer",background:active?C.accent:C.border,color:active?"#fff":C.muted,fontWeight:active?700:400,fontSize:13,whiteSpace:"nowrap"}}>{children}</button>;
const Inp=({label,textarea,...p})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:11,color:C.muted,marginBottom:4,fontWeight:600}}>{label}</div>}
    {textarea?<textarea {...p} rows={p.rows||3} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box",resize:"none",...(p.style||{})}}/>
      :<input {...p} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box",...(p.style||{})}}/>}
  </div>);
const Sel=({label,children,...p})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:11,color:C.muted,marginBottom:4,fontWeight:600}}>{label}</div>}
    <select {...p} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box"}}>{children}</select>
  </div>);
const Btn=({children,onClick,color=C.accent,small=false,style={}})=>
  <button onClick={onClick} style={{background:color,color:"#fff",border:"none",borderRadius:10,padding:small?"6px 14px":"12px 20px",cursor:"pointer",fontWeight:700,fontSize:small?12:14,width:small?"auto":"100%",...style}}>{children}</button>;
const Modal=({title,onClose,children,isMobile})=>(
  <div style={{position:"fixed",inset:0,background:"#000d",zIndex:200,display:"flex",alignItems:isMobile?"flex-end":"center",justifyContent:"center"}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:isMobile?"20px 20px 0 0":"20px",width:isMobile?"100%":"520px",padding:"24px 20px 36px",maxHeight:"93vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:17}}>{title}</div>
        <button onClick={onClose} style={{background:C.border,border:"none",borderRadius:99,width:32,height:32,cursor:"pointer",color:C.text,fontSize:18}}>×</button>
      </div>
      {children}
    </div>
  </div>);
const MiniBar=({data,color=C.accent,vk="worth",lk="month",height=64})=>{
  const max=Math.max(...data.map(d=>d[vk]),1);
  return(<div style={{display:"flex",alignItems:"flex-end",gap:6,height}}>
    {data.map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
      <div style={{width:"100%",background:color,borderRadius:"4px 4px 0 0",height:`${(d[vk]/max)*(height-12)}px`,minHeight:2,transition:"height .3s",opacity:.85}}/>
      <div style={{fontSize:9,color:C.muted}}>{d[lk]}</div>
    </div>)}
  </div>);};

// ── PIN ───────────────────────────────────────────────────────────────────────
const PinScreen=({onUnlock})=>{
  const hasPin=!!localStorage.getItem(PIN_KEY);
  const[digits,setDigits]=useState("");const[error,setError]=useState("");
  const[step,setStep]=useState(hasPin?"enter":"new1");const[first,setFirst]=useState("");
  const press=(k)=>{
    if(k==="del"){setDigits(p=>p.slice(0,-1));setError("");return;}
    const next=digits+k;setDigits(next);
    if(next.length===4){
      if(step==="enter"){if(next===localStorage.getItem(PIN_KEY))onUnlock();
        else{setError("Wrong PIN");setTimeout(()=>{setDigits("");setError("");},600);}}
      else if(step==="new1"){setFirst(next);setDigits("");setStep("new2");}
      else{if(next===first){localStorage.setItem(PIN_KEY,next);onUnlock();}
        else{setError("Don't match");setTimeout(()=>{setDigits("");setFirst("");setStep("new1");setError("");},700);}}}};
  const keys=["1","2","3","4","5","6","7","8","9","","0","del"];
  return(<div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:28,padding:24}}>
    <div style={{textAlign:"center"}}><div style={{fontSize:48}}>🔐</div>
      <div style={{fontWeight:800,fontSize:24,marginTop:10}}>Finance Tracker 007</div>
      <div style={{fontSize:13,color:C.muted,marginTop:4}}>{step==="enter"?"Enter PIN":step==="new1"?"Create PIN":"Confirm PIN"}</div></div>
    <div style={{display:"flex",gap:16}}>{[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:99,background:digits.length>i?C.accent:C.border,transition:"background .1s"}}/>)}</div>
    {error&&<div style={{color:C.red,fontSize:13,fontWeight:600}}>{error}</div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:12}}>
      {keys.map((k,i)=>k===""?<div key={i}/>:
        <button key={i} onClick={()=>press(k)} style={{height:72,borderRadius:16,border:`1px solid ${C.border}`,cursor:"pointer",background:k==="del"?C.cardAlt:C.card,color:C.text,fontSize:k==="del"?20:24,fontWeight:700}}>{k==="del"?"⌫":k}</button>)}
    </div>
    {hasPin&&<button onClick={()=>{localStorage.removeItem(PIN_KEY);onUnlock();}} style={{background:"none",border:"none",color:C.muted,fontSize:12,cursor:"pointer"}}>Remove PIN</button>}
  </div>);};

const LoginScreen=()=>{
  const[loading,setLoading]=useState(false);const[err,setErr]=useState("");
  const login=async()=>{setLoading(true);setErr("");
    try{const{auth,GoogleAuthProvider,signInWithPopup}=window.__firebase;await signInWithPopup(auth,new GoogleAuthProvider());}
    catch(e){setErr(e.message);setLoading(false);}};
  return(<div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:32}}>
    <div style={{textAlign:"center"}}><div style={{fontSize:56}}>💰</div>
      <div style={{fontWeight:800,fontSize:28,marginTop:12}}>Finance Tracker 007</div>
      <div style={{fontSize:14,color:C.muted,marginTop:6,maxWidth:280,lineHeight:1.6}}>Sign in to sync across all your devices</div></div>
    <button onClick={login} disabled={loading} style={{background:"#fff",color:"#1a1a1a",border:"none",borderRadius:12,padding:"14px 28px",cursor:"pointer",fontWeight:700,fontSize:15,display:"flex",alignItems:"center",gap:10,opacity:loading?.6:1}}>
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"/>
      {loading?"Signing in…":"Continue with Google"}
    </button>
    {err&&<div style={{color:C.red,fontSize:12,textAlign:"center",maxWidth:280}}>{err}</div>}
  </div>);};

// ═══════════════════════════════════════════════════════════════════════════════
function App(){
  const isMobile=useIsMobile();
  const[fbReady,setFbReady]=useState(!!window.__firebase);
  const[user,setUser]=useState(null);
  const[pinOk,setPinOk]=useState(false);
  const[data,setData]=useState(EMPTY);
  const[tab,setTab]=useState("home");
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[editTarget,setEditTarget]=useState(null);
  const[syncSt,setSyncSt]=useState("idle");
  const[cur,setCur]=useState("USD");
  const saveTimer=useRef(null);
  const recurringTimer=useRef(null);

  useEffect(()=>{if(window.__firebase){setFbReady(true);return;}
    const h=()=>setFbReady(true);window.addEventListener("firebaseReady",h);
    return()=>window.removeEventListener("firebaseReady",h);},[]);
  useEffect(()=>{if(!fbReady)return;const{auth,onAuthStateChanged}=window.__firebase;
    return onAuthStateChanged(auth,u=>{setUser(u);if(!u){setData(EMPTY);setPinOk(false);}});},[fbReady]);
  useEffect(()=>{if(!user||!fbReady)return;const{db,doc,onSnapshot}=window.__firebase;
    return onSnapshot(doc(db,"users",user.uid,"finance","data"),snap=>{
      if(snap.exists()){const d=snap.data();setData({...EMPTY,...d});setCur(d.currency||"USD");}});},[user,fbReady]);

  // ── auto-process recurring transactions ────────────────────────────────────
  useEffect(()=>{
    if(!data.recurring||!data.recurring.length)return;
    const mk=thisMonthKey();
    const toAdd=data.recurring.filter(r=>r.active&&r.lastLogged!==mk);
    if(!toAdd.length)return;
    const newExps=toAdd.map(r=>({id:Date.now()+Math.random(),date:today(),
      desc:r.desc,amount:r.amount,cat:r.cat,source:r.source,note:"🔁 Auto-logged (recurring)",txType:"new"}));
    update(d=>{
      let banks=[...d.banks];let cards=[...d.cards];
      newExps.forEach(e=>{
        banks=banks.map(b=>b.name===e.source?{...b,balance:b.balance-e.amount}:b);
        cards=cards.map(c=>{const n=`${c.name}${c.last4?" ····"+c.last4:""}`;
          return n===e.source?{...c,used:c.used+e.amount}:c;});
      });
      return{...d,expenses:[...newExps,...d.expenses],banks,cards,
        recurring:d.recurring.map(r=>toAdd.find(x=>x.id===r.id)?{...r,lastLogged:mk}:r)};
    });
  },[data.recurring,user]);

  // ── monthly snapshot for net worth history ─────────────────────────────────
  useEffect(()=>{
    if(!user)return;
    const mk=thisMonthKey();
    const snaps=data.monthlySnapshots||[];
    if(snaps.find(s=>s.month===mk))return;
    const totalBank=data.banks.reduce((s,b)=>s+b.balance,0);
    const totalUsed=data.cards.reduce((s,c)=>s+c.used,0);
    const investVal=data.investments.reduce((s,i)=>s+i.qty*i.buyPrice,0);
    const worth=totalBank-totalUsed+investVal;
    if(worth===0)return;
    update(d=>({...d,monthlySnapshots:[...(d.monthlySnapshots||[]).slice(-11),
      {month:new Date().toLocaleString("en-US",{month:"short",year:"2-digit"}),worth}]}));
  },[user,data.banks,data.cards,data.investments]);

  const saveToFirestore=useCallback((d)=>{
    if(!user||!fbReady)return;clearTimeout(saveTimer.current);setSyncSt("saving");
    saveTimer.current=setTimeout(async()=>{
      try{const{db,doc,setDoc}=window.__firebase;
        await setDoc(doc(db,"users",user.uid,"finance","data"),d,{merge:true});
        setSyncSt("saved");setTimeout(()=>setSyncSt("idle"),2000);}
      catch{setSyncSt("error");}},1500);},[user,fbReady]);

  const update=(fn)=>{setData(prev=>{const next=fn(prev);saveToFirestore(next);return next;});};
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const closeModal=()=>{setModal(null);setForm({});setEditTarget(null);};
  const openEdit=(m,item)=>{setEditTarget(item);setForm({...item});setModal(m);};

  // computed
  const totalBank=data.banks.reduce((s,b)=>s+b.balance,0);
  const totalUsed=data.cards.reduce((s,c)=>s+c.used,0);
  const totalLimit=data.cards.reduce((s,c)=>s+c.limit,0);
  const totalSub=data.subs.filter(s=>s.cycle==="Monthly").reduce((a,s)=>a+s.amount,0);
  const familyOwed=data.family.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0);
  const investVal=data.investments.reduce((s,i)=>s+i.qty*i.buyPrice,0);
  const netWorth=totalBank-totalUsed+investVal;
  const mk=thisMonthKey();
  const monthExp=data.expenses.filter(e=>e.date.startsWith(mk));
  const monthTotal=monthExp.reduce((s,e)=>s+e.amount,0);
  const prevMk=(()=>{const d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const prevMonthTotal=data.expenses.filter(e=>e.date.startsWith(prevMk)).reduce((s,e)=>s+e.amount,0);
  const byCat={};monthExp.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  const catList=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const spendTrend=Array.from({length:6},(_,i)=>{
    const d=new Date();d.setMonth(d.getMonth()-(5-i));
    const key=d.toISOString().slice(0,7);
    return{month:d.toLocaleString("en-US",{month:"short"}),
      worth:data.expenses.filter(e=>e.date.startsWith(key)).reduce((s,e)=>s+e.amount,0)};});
  const allSources=[...data.banks.map(b=>b.name),...data.cards.map(c=>`${c.name}${c.last4?" ····"+c.last4:""}`)];
  const syncColor=syncSt==="saved"?C.green:syncSt==="saving"?C.amber:syncSt==="error"?C.red:C.muted;
  const syncLabel=syncSt==="saved"?"☁ Synced":syncSt==="saving"?"⏳ Saving…":syncSt==="error"?"✗ Error":"☁ Firebase";
  const debtOwedToMe=(data.debts||[]).filter(d=>d.direction==="owed_to_me").reduce((s,d)=>s+(d.paid?0:d.amount),0);
  const debtIOwe=(data.debts||[]).filter(d=>d.direction==="i_owe").reduce((s,d)=>s+(d.paid?0:d.amount),0);

  // ── ACTIONS ───────────────────────────────────────────────────────────────────
  const saveExpense=()=>{
    if(!form.desc||!form.amount||!form.source)return;
    const amt=parseFloat(form.amount);const isOld=form.txType==="old";
    if(editTarget){
      const oldAmt=editTarget.amount;const oldSrc=editTarget.source;const wasOld=editTarget.txType==="old";
      update(d=>({...d,expenses:d.expenses.map(e=>e.id===editTarget.id?{...e,...form,amount:amt}:e),
        banks:d.banks.map(b=>{let bal=b.balance;
          if(b.name===oldSrc&&!wasOld)bal+=oldAmt;if(b.name===form.source&&!isOld)bal-=amt;return{...b,balance:bal};}),
        cards:d.cards.map(c=>{const on=`${c.name}${c.last4?" ····"+c.last4:""}`;let used=c.used;
          if(on===oldSrc&&!wasOld)used-=oldAmt;if(on===form.source&&!isOld)used+=amt;return{...c,used:Math.max(0,used)};})
      }));
    } else {
      const e={id:Date.now(),date:form.date||today(),desc:form.desc,amount:amt,cat:form.cat||"Other",source:form.source,note:form.note||"",txType:form.txType||"new"};
      update(d=>({...d,expenses:[e,...d.expenses],
        banks:isOld?d.banks:d.banks.map(b=>b.name===form.source?{...b,balance:b.balance-amt}:b),
        cards:isOld?d.cards:d.cards.map(c=>{const n=`${c.name}${c.last4?" ····"+c.last4:""}`;return n===form.source?{...c,used:c.used+amt}:c;})}));
    }
    closeModal();
  };
  const saveBank=()=>{
    if(!form.name||!form.balance)return;
    if(editTarget)update(d=>({...d,banks:d.banks.map(b=>b.id===editTarget.id?{...b,...form,balance:parseFloat(form.balance)}:b)}));
    else update(d=>({...d,banks:[...d.banks,{id:Date.now(),name:form.name,type:form.type||"checking",balance:parseFloat(form.balance),icon:"🏦"}]}));
    closeModal();
  };
  const saveCard=()=>{
    if(!form.name||!form.limit)return;
    if(editTarget)update(d=>({...d,cards:d.cards.map(c=>c.id===editTarget.id?{...c,name:form.name,limit:parseFloat(form.limit),used:parseFloat(form.used)||c.used,last4:form.last4||""}:c)}));
    else update(d=>({...d,cards:[...d.cards,{id:Date.now(),name:form.name,limit:parseFloat(form.limit),used:parseFloat(form.used)||0,last4:form.last4||"",icon:"💳"}]}));
    closeModal();
  };
  const saveFamily=()=>{
    if(!form.name||!form.amount)return;
    if(editTarget)update(d=>({...d,family:d.family.map(f=>f.id===editTarget.id?{...f,...form,amount:parseFloat(form.amount)}:f)}));
    else update(d=>({...d,family:[...d.family,{id:Date.now(),name:form.name,amount:parseFloat(form.amount),date:form.date||today(),note:form.note||"",paid:false}]}));
    closeModal();
  };
  const saveSub=()=>{
    if(!form.name||!form.amount)return;

    const monthly=data.subs.filter(s=>s.cycle==="Monthly").reduce((a,s)=>a+s.amount,0);
    const yearly=data.subs.reduce((a,s)=>a+(s.cycle==="Monthly"?s.amount*12:s.amount),0);
    return(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:20}}>Subscriptions</div>
        <Btn onClick={()=>{setForm({cycle:"Monthly"});setModal("sub");}} small>+ Add</Btn>
      </div>
      <div className="g4" style={{marginBottom:16}}>
        {[{l:"MONTHLY",v:fmt(monthly,cur),c:C.amber},{l:"YEARLY",v:fmt(yearly,cur),c:C.red},{l:"ACTIVE",v:data.subs.length,c:C.green}].map((s,i)=>(
          <Card key={i}><div style={{fontSize:11,color:C.muted,fontWeight:600}}>{s.l}</div>
            <div style={{fontSize:22,fontWeight:800,color:s.c,marginTop:4}}>{s.v}</div></Card>))}
      </div>
      <div className="g3">
        {data.subs.map(s=>{const days=Math.ceil((new Date(s.nextDate)-new Date())/(864e5));
          return(<Card key={s.id} style={{marginBottom:isMobile?10:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                <span style={{fontSize:26}}>{s.icon||"📋"}</span>
                <div><div style={{fontWeight:700}}>{s.name}</div>
                  <div style={{fontSize:12,color:days<=3?C.red:C.muted}}>{days<=3?`⚠️ Due in ${days}d`:`Next: ${s.nextDate}`} · {s.cycle}</div>
                  {s.deductFrom&&<div style={{fontSize:11,color:C.blue,marginTop:2}}>💳 {s.deductFrom}</div>}
                  {s.note&&<div style={{fontSize:11,color:C.muted,fontStyle:"italic",marginTop:2}}>📝 {s.note}</div>}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                <div style={{fontWeight:800}}>{fmt(s.amount,cur)}</div>
                <button onClick={()=>openEdit("sub",s)} style={{background:C.accent,border:"none",borderRadius:7,padding:"3px 8px",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:700}}>✏️</button>
                <button onClick={()=>del("subs",s.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14}}>🗑</button>
              </div>
            </div>
          </Card>);})}
      </div>
    </div>);};

  // ── NOTES ─────────────────────────────────────────────────────────────────────
  const NOTE_TAGS=["General","Gifts","Travel","Family","Work","Food","Health","Shopping","Invest","Other"];
  const NotesContent=()=>{
    const[ft,setFt]=useState("All");const notes=data.notes||[];
    const filtered=ft==="All"?notes:notes.filter(n=>n.tag===ft);
    return(<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:20}}>Notes</div>
        <Btn onClick={()=>{setForm({tag:"General",date:today()});setModal("note");}} small>+ New Note</Btn>
      </div>
      <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8,marginBottom:16}}>
        {["All",...NOTE_TAGS].map(t=><Pill key={t} active={ft===t} onClick={()=>setFt(t)}>{t}</Pill>)}
      </div>
      <div className="g2">
        {filtered.length===0?<div style={{color:C.muted,textAlign:"center",paddingTop:40}}>No notes yet</div>
          :filtered.map(n=>{const tc=CAT_COLORS[n.tag]||C.accent;
            return(<Card key={n.id} style={{marginBottom:isMobile?10:0,borderLeft:`4px solid ${tc}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div><div style={{fontWeight:700,fontSize:16}}>{n.title}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{n.date}</div></div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <Tag label={n.tag} color={tc}/>
                  <button onClick={()=>openEdit("note",n)} style={{background:C.accent,border:"none",borderRadius:7,padding:"3px 8px",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:700}}>✏️</button>
                  <button onClick={()=>del("notes",n.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16}}>🗑</button>
                </div>
              </div>
              {n.content&&<div style={{fontSize:13,color:C.muted,lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{n.content}</div>}
            </Card>);})}
      </div>
    </div>);};

  // ── SETTINGS ─────────────────────────────────────────────────────────────────
  const SettingsContent=()=>(
    <div style={{maxWidth:600}}>
      <div style={{fontWeight:700,fontSize:20,marginBottom:16}}>Settings</div>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:600,marginBottom:8}}>Account</div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <img src={user.photoURL||""} style={{width:44,height:44,borderRadius:99,border:`2px solid ${C.accent}`,objectFit:"cover",background:C.accent}} onError={e=>e.target.style.display="none"}/>
          <div><div style={{fontWeight:700}}>{user.displayName}</div><div style={{fontSize:12,color:C.muted}}>{user.email}</div></div>
        </div>
        <Btn onClick={signOutUser} color={C.border}>Sign Out</Btn>
      </Card>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:600,marginBottom:12}}>Display Currency</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {Object.keys(CURRENCIES).map(c=><Pill key={c} active={cur===c} onClick={()=>changeCurrency(c)}>{c} {CURRENCIES[c].symbol}</Pill>)}
        </div>
        <div style={{fontSize:11,color:C.muted,marginTop:8}}>Approximate rates, display only.</div>
      </Card>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:600,marginBottom:8}}>WhatsApp Summary</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:12}}>Send a full financial summary to yourself or your wife via WhatsApp.</div>
        <button onClick={generateWhatsApp} style={{width:"100%",background:"#25D366",color:"#fff",border:"none",borderRadius:10,padding:"12px",cursor:"pointer",fontWeight:700,fontSize:14}}>📱 Open in WhatsApp</button>
      </Card>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:600,marginBottom:8}}>Export Data</div>
        <Btn onClick={exportCSV} color={C.blue}>⬇ Export CSV</Btn>
      </Card>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:600,marginBottom:8}}>PIN Lock</div>
        <Btn onClick={()=>{localStorage.removeItem(PIN_KEY);setPinOk(false);}} color={C.accent}>
          {localStorage.getItem(PIN_KEY)?"Change PIN":"Set PIN"}</Btn>
      </Card>
      <Card>
        <div style={{fontWeight:600,marginBottom:8,color:C.red}}>Reset All Data</div>
        <Btn onClick={()=>{if(window.confirm("Clear ALL data?"))update(()=>EMPTY);}} color={C.red}>Reset Data</Btn>
      </Card>
    </div>);

  const contentMap={home:<HomeContent/>,accounts:<AccountsContent/>,expenses:<ExpensesContent/>,
    recurring:<RecurringContent/>,invest:<InvestContent/>,gifts:<GiftsContent/>,
    family:<FamilyContent/>,debts:<DebtsContent/>,subs:<SubsContent/>,
    notes:<NotesContent/>,settings:<SettingsContent/>};

  if(!fbReady)return(<div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={{fontSize:48}}>💰</div><div style={{color:C.muted,fontSize:14}}>Loading…</div></div>);
  if(!user)return <LoginScreen/>;
  if(!pinOk)return <PinScreen onUnlock={()=>setPinOk(true)}/>;

  return(
    <div id="app-shell">
      <div id="sidebar">
        <div style={{padding:"0 20px 20px",borderBottom:`1px solid ${C.border}`,marginBottom:8}}>
          <div style={{fontSize:18,fontWeight:800}}>💰 Finance</div>
          <div style={{fontSize:10,color:C.muted,marginTop:2}}>Tracker 007</div>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{width:"100%",border:"none",cursor:"pointer",
              display:"flex",alignItems:"center",gap:12,padding:"11px 20px",
              background:tab===t.id?"#1e2130":"none",color:tab===t.id?C.text:C.muted,
              borderLeft:tab===t.id?`3px solid ${C.accent}`:"3px solid transparent",
              fontSize:13,fontWeight:tab===t.id?700:400,transition:"all .15s",textAlign:"left"}}>
              <span style={{fontSize:17}}>{t.icon}</span>{t.label}
            </button>))}
        </div>
        <div style={{padding:"16px 20px",borderTop:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <img src={user.photoURL||""} style={{width:32,height:32,borderRadius:99,border:`2px solid ${C.accent}`,objectFit:"cover",background:C.accent}} onError={e=>e.target.style.display="none"}/>
            <div><div style={{fontSize:12,fontWeight:700}}>{user.displayName?.split(" ")[0]}</div>
              <div style={{fontSize:10,color:syncColor}}>{syncLabel}</div></div>
          </div>
        </div>
      </div>

      <div id="main-area">
        <div id="top-bar">
          <div>
            <div style={{fontWeight:800,fontSize:isMobile?18:22}}>{TABS.find(t=>t.id===tab)?.label}</div>
            <div style={{fontSize:11,color:C.muted}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <button onClick={generateWhatsApp} style={{background:"#25D366",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontWeight:700,fontSize:12}}>📱 WA</button>
            <div style={{fontSize:12,color:C.muted,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",cursor:"pointer"}} onClick={()=>setTab("settings")}>{CURRENCIES[cur].symbol} {cur}</div>
            {isMobile&&<img src={user.photoURL||""} style={{width:34,height:34,borderRadius:99,border:`2px solid ${C.accent}`,objectFit:"cover",background:C.accent}} onError={e=>e.target.style.display="none"}/>}
          </div>
        </div>
        <div id="content-area">{contentMap[tab]||<HomeContent/>}</div>
      </div>

      {/* mobile bottom nav */}
      <div id="bottom-nav" style={{position:"fixed",bottom:0,left:0,right:0,background:C.sidebar,borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-around",padding:"6px 0 14px",zIndex:50,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",cursor:"pointer",padding:"4px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:1,flexShrink:0}}>
            <span style={{fontSize:17}}>{t.icon}</span>
            <span style={{fontSize:8,fontWeight:600,color:tab===t.id?C.accent:C.muted,whiteSpace:"nowrap"}}>{t.label}</span>
            {tab===t.id&&<div style={{width:3,height:3,borderRadius:99,background:C.accent}}/>}
          </button>))}
      </div>

      {/* ══ MODALS ══ */}
      {modal==="expense"&&(
        <Modal title={editTarget?"Edit Expense":"Add Expense"} onClose={closeModal} isMobile={isMobile}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {["new","old"].map(t=>(
              <button key={t} onClick={()=>f("txType",t)} style={{padding:"10px",borderRadius:10,border:`2px solid ${form.txType===t?C.accent:C.border}`,cursor:"pointer",background:form.txType===t?C.accent+"22":C.cardAlt,color:C.text,fontWeight:700,fontSize:13}}>
                {t==="new"?"🆕 New":"🕒 Old (already in balance"}</button>))}
          </div>
          {form.txType==="old"&&<div style={{background:C.cardAlt,borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:C.amber}}>⚠️ Old — recorded for history only, won't touch your balance.</div>}
          <Inp label="Description" placeholder="e.g. Gift for Dad" value={form.desc||""} onChange={e=>f("desc",e.target.value)}/>
          <Inp label="Amount (USD)" type="number" placeholder="0.00" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Date" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <Sel label="Category" value={form.cat||""} onChange={e=>f("cat",e.target.value)}>
            <option value="">Select category</option>{CATS.map(c=><option key={c}>{c}</option>)}</Sel>
          <Sel label="Paid via" value={form.source||""} onChange={e=>f("source",e.target.value)}>
            <option value="">Select account / card</option>{allSources.map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Notes (optional)" textarea placeholder="e.g. Birthday gift, shipped to India" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveExpense}>{editTarget?"Update":"Save"} Expense</Btn>
        </Modal>)}

      {modal==="bank"&&(
        <Modal title={editTarget?"Edit Bank Account":"Add Bank Account"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Account name" value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Sel label="Type" value={form.type||"checking"} onChange={e=>f("type",e.target.value)}>
            <option value="checking">Checking</option><option value="savings">Savings</option></Sel>
          <Inp label="Current balance ($)" type="number" value={form.balance||""} onChange={e=>f("balance",e.target.value)}/>
          <Btn onClick={saveBank}>{editTarget?"Update":"Add"} Account</Btn>
        </Modal>)}

      {modal==="card"&&(
        <Modal title={editTarget?"Edit Card":"Add Credit Card"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Card name" placeholder="e.g. Amex Gold" value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Last 4 digits (optional)" placeholder="e.g. 4821" maxLength={4} value={form.last4||""} onChange={e=>f("last4",e.target.value)}/>
          <Inp label="Credit limit ($)" type="number" value={form.limit||""} onChange={e=>f("limit",e.target.value)}/>
          <Inp label="Current used balance ($)" type="number" value={form.used||""} onChange={e=>f("used",e.target.value)}/>
          <Btn onClick={saveCard}>{editTarget?"Update":"Add"} Card</Btn>
        </Modal>)}

      {modal==="family"&&(
        <Modal title={editTarget?"Edit Entry":"Add Family Transaction"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Person" placeholder="e.g. Mom" value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Amount ($)" type="number" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Date" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <Inp label="Note" placeholder="e.g. Monthly support" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveFamily}>{editTarget?"Update":"Add"}</Btn>
        </Modal>)}

      {modal==="sub"&&(
        <Modal title={editTarget?"Edit Subscription":"Add Subscription"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Service name" value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Amount ($)" type="number" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Sel label="Billing cycle" value={form.cycle||"Monthly"} onChange={e=>f("cycle",e.target.value)}>
            <option>Monthly</option><option>Yearly</option></Sel>
          <Inp label="Next billing date" type="date" value={form.nextDate||today()} onChange={e=>f("nextDate",e.target.value)}/>
          <Sel label="Charged to (card/bank)" value={form.deductFrom||""} onChange={e=>f("deductFrom",e.target.value)}>
            <option value="">Select card / bank (optional)</option>{allSources.map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Notes" placeholder="e.g. Family plan" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveSub}>{editTarget?"Update":"Add"} Subscription</Btn>
        </Modal>)}

      {modal==="investment"&&(
        <Modal title={editTarget?"Edit Investment":"Add Investment"} onClose={closeModal} isMobile={isMobile}>
          <Sel label="Type" value={form.itype||form.type||"Stock"} onChange={e=>f("itype",e.target.value)}>
            <option>Stock</option><option>Crypto</option><option>ETF</option><option>Mutual Fund</option></Sel>
          <Inp label="Name" placeholder="e.g. Bitcoin / Apple" value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Ticker / Symbol" placeholder="e.g. BTC, AAPL" value={form.ticker||""} onChange={e=>f("ticker",e.target.value)}/>
          <Inp label="Quantity" type="number" value={form.qty||""} onChange={e=>f("qty",e.target.value)}/>
          <Inp label="Buy price per unit ($)" type="number" value={form.buyPrice||""} onChange={e=>f("buyPrice",e.target.value)}/>
          <Inp label="Date bought" type="date" value={form.buyDate||today()} onChange={e=>f("buyDate",e.target.value)}/>
          <Inp label="Platform" placeholder="e.g. Coinbase, Robinhood, Zerodha" value={form.platform||""} onChange={e=>f("platform",e.target.value)}/>
          <Inp label="Ideal sell target ($ per unit)" type="number" value={form.target||""} onChange={e=>f("target",e.target.value)}/>
          <Inp label="Notes" textarea placeholder="e.g. Long hold" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveInvestment}>{editTarget?"Update":"Add"} Investment</Btn>
        </Modal>)}

      {modal==="note"&&(
        <Modal title={editTarget?"Edit Note":"New Note"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Title" placeholder="e.g. Gifts for India Trip" value={form.title||""} onChange={e=>f("title",e.target.value)}/>
          <Sel label="Tag" value={form.tag||"General"} onChange={e=>f("tag",e.target.value)}>
            {["General","Gifts","Travel","Family","Work","Food","Health","Shopping","Invest","Other"].map(t=><option key={t}>{t}</option>)}</Sel>
          <Inp label="Date" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <Inp label="Note content" textarea rows={8} placeholder={"Write anything...\n• Bought watch for Dad - $250\n• Saree for Mom - $80"} value={form.content||""} onChange={e=>f("content",e.target.value)}/>
          <Btn onClick={saveNote}>{editTarget?"Update":"Save"} Note</Btn>
        </Modal>)}

      {modal==="gift"&&(
        <Modal title={editTarget?"Edit Gift":"Add India Gift"} onClose={closeModal} isMobile={isMobile}>
          <Inp label="Recipient (who is it for?)" placeholder="e.g. Mom, Dad, Priya" value={form.recipient||""} onChange={e=>f("recipient",e.target.value)}/>
          <Inp label="Occasion" placeholder="e.g. Diwali, Birthday, Wedding" value={form.occasion||""} onChange={e=>f("occasion",e.target.value)}/>
          <Inp label="Item / Description" placeholder="e.g. Gold watch, Silk saree" value={form.item||""} onChange={e=>f("item",e.target.value)}/>
          <Inp label="Amount ($)" type="number" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Purchase Date" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <Inp label="Platform / Store" placeholder="e.g. Amazon, Local store, Costco" value={form.platform||""} onChange={e=>f("platform",e.target.value)}/>
          <Sel label="Paid via (card)" value={form.card||""} onChange={e=>f("card",e.target.value)}>
            <option value="">Select card / bank</option>{allSources.map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Order Number (optional)" placeholder="e.g. 114-2847291-xxx" value={form.orderNo||""} onChange={e=>f("orderNo",e.target.value)}/>
          <Sel label="Shipping Status" value={form.shippingStatus||"Ordered"} onChange={e=>f("shippingStatus",e.target.value)}>
            {["Ordered","Shipped","In Transit","Delivered","Returned"].map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Tracking Number (optional)" placeholder="e.g. 1Z999AA1..." value={form.trackingNo||""} onChange={e=>f("trackingNo",e.target.value)}/>
          <Inp label="Notes" textarea placeholder="e.g. Asked Mom to confirm delivery" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveGift}>{editTarget?"Update":"Add"} Gift</Btn>
        </Modal>)}

      {modal==="debt"&&(
        <Modal title={editTarget?"Edit Debt":"Add Debt"} onClose={closeModal} isMobile={isMobile}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {[["owed_to_me","💚 They Owe Me"],["i_owe","🔴 I Owe Them"]].map(([v,l])=>(
              <button key={v} onClick={()=>f("direction",v)} style={{padding:"10px",borderRadius:10,border:`2px solid ${form.direction===v?C.accent:C.border}`,cursor:"pointer",background:form.direction===v?C.accent+"22":C.cardAlt,color:C.text,fontWeight:700,fontSize:13}}>{l}</button>))}
          </div>
          <Inp label="Person" placeholder="e.g. John, Rahul" value={form.person||""} onChange={e=>f("person",e.target.value)}/>
          <Inp label="Amount ($)" type="number" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Date" type="date" value={form.date||today()} onChange={e=>f("date",e.target.value)}/>
          <Inp label="Due Date (optional)" type="date" value={form.dueDate||""} onChange={e=>f("dueDate",e.target.value)}/>
          <Inp label="Note" placeholder="e.g. Lent for car repair" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveDebt}>{editTarget?"Update":"Add"} Debt</Btn>
        </Modal>)}

      {modal==="recurring"&&(
        <Modal title={editTarget?"Edit Recurring":"Add Recurring Transaction"} onClose={closeModal} isMobile={isMobile}>
          <div style={{background:C.cardAlt,borderRadius:10,padding:"10px 12px",marginBottom:12,fontSize:12,color:C.muted}}>
            🔁 This will auto-log every month automatically. Use for rent, gym, salary, EMI etc.</div>
          <Inp label="Description" placeholder="e.g. Rent, Gym, Netflix" value={form.desc||""} onChange={e=>f("desc",e.target.value)}/>
          <Inp label="Amount ($)" type="number" value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Sel label="Category" value={form.cat||"Other"} onChange={e=>f("cat",e.target.value)}>
            {CATS.map(c=><option key={c}>{c}</option>)}</Sel>
          <Sel label="Deduct from" value={form.source||""} onChange={e=>f("source",e.target.value)}>
            <option value="">Select account / card</option>{allSources.map(s=><option key={s}>{s}</option>)}</Sel>
          <Inp label="Notes (optional)" placeholder="e.g. Due on 1st of every month" value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={saveRecurring}>{editTarget?"Update":"Add"} Recurring</Btn>
        </Modal>)}
    </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
