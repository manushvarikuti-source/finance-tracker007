<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── constants ─────────────────────────────────────────────────────────────────
const PIN_KEY = "vl_pin_v3";
const today   = () => new Date().toISOString().split("T")[0];

const CURRENCIES = {
  USD:{symbol:"$",rate:1}, INR:{symbol:"₹",rate:83.5},
  EUR:{symbol:"€",rate:0.92}, GBP:{symbol:"£",rate:0.79},
};
const fmt = (n,cur="USD") => {
  const {symbol,rate}=CURRENCIES[cur]||CURRENCIES.USD;
  const v=(n||0)*rate;
  return `${symbol}${v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
};

const CATS=["Rent/Mortgage","Groceries","Dining Out","Transport","Utilities",
  "Shopping","Gifts","Entertainment","Subscriptions","Family","Medical","Travel","Crypto/Stocks","Other"];

const CAT_COLORS={
  "Rent/Mortgage":"#3b82f6","Groceries":"#22c55e","Dining Out":"#f59e0b",
  "Transport":"#06b6d4","Utilities":"#8b5cf6","Shopping":"#ec4899",
  "Gifts":"#f97316","Entertainment":"#a855f7","Subscriptions":"#ef4444",
  "Family":"#14b8a6","Medical":"#e11d48","Travel":"#0ea5e9",
  "Crypto/Stocks":"#84cc16","Other":"#64748b",
};

const QUICK_DEFAULTS=[
  {icon:"🛒",label:"Groceries",cat:"Groceries"},
  {icon:"🍽",label:"Dining",cat:"Dining Out"},
  {icon:"⛽",label:"Fuel",cat:"Transport"},
  {icon:"🎁",label:"Gift",cat:"Gifts"},
  {icon:"💊",label:"Medical",cat:"Medical"},
  {icon:"✈️",label:"Travel",cat:"Travel"},
];

const EMPTY = {
  banks:[], cards:[], expenses:[], family:[],
  subs:[], investments:[], netWorthHistory:[],
  currency:"USD", quickAdds:QUICK_DEFAULTS,
};

// ── colours ───────────────────────────────────────────────────────────────────
const C={
  bg:"#0f1117",card:"#1a1d27",cardAlt:"#20243a",border:"#2a2e45",
  green:"#22c55e",red:"#ef4444",amber:"#f59e0b",blue:"#3b82f6",
  purple:"#a855f7",text:"#f1f5f9",muted:"#64748b",accent:"#7c3aed",
};

// ── atoms ─────────────────────────────────────────────────────────────────────
const Card=({children,style={}})=>(
  <div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`,...style}}>{children}</div>
);
const Tag=({label,color})=>(
  <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,
    background:color+"22",color,letterSpacing:.5,whiteSpace:"nowrap"}}>{label}</span>
);
const Pill=({active,onClick,children})=>(
  <button onClick={onClick} style={{padding:"6px 14px",borderRadius:99,border:"none",cursor:"pointer",
    background:active?C.accent:C.border,color:active?"#fff":C.muted,
    fontWeight:active?700:400,fontSize:13,whiteSpace:"nowrap"}}>{children}</button>
);
const Inp=({label,textarea,...p})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:11,color:C.muted,marginBottom:4,fontWeight:600}}>{label}</div>}
    {textarea
      ?<textarea {...p} rows={3} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,
          borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",
          boxSizing:"border-box",resize:"none",...(p.style||{})}}/>
      :<input {...p} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,
          borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",
          boxSizing:"border-box",...(p.style||{})}}/>
    }
  </div>
);
const Sel=({label,children,...p})=>(
  <div style={{marginBottom:12}}>
    {label&&<div style={{fontSize:11,color:C.muted,marginBottom:4,fontWeight:600}}>{label}</div>}
    <select {...p} style={{width:"100%",background:C.cardAlt,border:`1px solid ${C.border}`,
      borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box"}}>
      {children}
    </select>
  </div>
);
const Btn=({children,onClick,color=C.accent,small=false,style={}})=>(
  <button onClick={onClick} style={{background:color,color:"#fff",border:"none",borderRadius:10,
    padding:small?"6px 14px":"12px 20px",cursor:"pointer",fontWeight:700,
    fontSize:small?12:14,width:small?"auto":"100%",...style}}>{children}</button>
);
const Modal=({title,onClose,children})=>(
  <div style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",alignItems:"flex-end"}}
    onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:"20px 20px 0 0",
      width:"100%",padding:"20px 16px 36px",maxHeight:"93vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:17}}>{title}</div>
        <button onClick={onClose} style={{background:C.border,border:"none",borderRadius:99,
          width:32,height:32,cursor:"pointer",color:C.text,fontSize:18}}>×</button>
      </div>
      {children}
    </div>
  </div>
);

// ── mini bar chart ────────────────────────────────────────────────────────────
const MiniBar=({data,color=C.accent,vk="worth",lk="month"})=>{
  const max=Math.max(...data.map(d=>d[vk]),1);
  return(
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:64}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{width:"100%",background:color,borderRadius:"4px 4px 0 0",
            height:`${(d[vk]/max)*54}px`,minHeight:2,transition:"height .3s"}}/>
          <div style={{fontSize:9,color:C.muted}}>{d[lk]}</div>
        </div>
      ))}
    </div>
  );
};

// ── PIN screen ────────────────────────────────────────────────────────────────
const PinScreen=({onUnlock})=>{
  const hasPin=!!localStorage.getItem(PIN_KEY);
  const [digits,setDigits]=useState("");
  const [error,setError]=useState("");
  const [step,setStep]=useState(hasPin?"enter":"new1");
  const [first,setFirst]=useState("");

  const press=(k)=>{
    if(k==="del"){setDigits(p=>p.slice(0,-1));setError("");return;}
    const next=digits+k;
    setDigits(next);
    if(next.length===4){
      if(step==="enter"){
        if(next===localStorage.getItem(PIN_KEY)){onUnlock();}
        else{setError("Wrong PIN");setTimeout(()=>{setDigits("");setError("");},600);}
      } else if(step==="new1"){
        setFirst(next);setDigits("");setStep("new2");
      } else {
        if(next===first){localStorage.setItem(PIN_KEY,next);onUnlock();}
        else{setError("Don't match");setTimeout(()=>{setDigits("");setFirst("");setStep("new1");setError("");},700);}
      }
    }
  };
  const keys=["1","2","3","4","5","6","7","8","9","","0","del"];
  const title=step==="enter"?"Enter PIN":step==="new1"?"Create PIN":"Confirm PIN";
  return(
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",gap:28,padding:24}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:40}}>🔐</div>
        <div style={{fontWeight:800,fontSize:22,color:C.text,marginTop:8}}>Finance Tracker</div>
        <div style={{fontSize:13,color:C.muted,marginTop:4}}>{title}</div>
      </div>
      <div style={{display:"flex",gap:16}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{width:16,height:16,borderRadius:99,
            background:digits.length>i?C.accent:C.border,transition:"background .1s"}}/>
        ))}
      </div>
      {error&&<div style={{color:C.red,fontSize:13,fontWeight:600}}>{error}</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:12}}>
        {keys.map((k,i)=>(
          k===""?<div key={i}/>:
          <button key={i} onClick={()=>press(k)} style={{height:72,borderRadius:16,border:`1px solid ${C.border}`,
            cursor:"pointer",background:k==="del"?C.cardAlt:C.card,color:C.text,
            fontSize:k==="del"?20:24,fontWeight:700}}>
            {k==="del"?"⌫":k}
          </button>
        ))}
      </div>
      {hasPin&&(
        <button onClick={()=>{localStorage.removeItem(PIN_KEY);onUnlock();}}
          style={{background:"none",border:"none",color:C.muted,fontSize:12,cursor:"pointer"}}>
          Remove PIN
        </button>
      )}
    </div>
  );
};

// ── Google login screen ───────────────────────────────────────────────────────
const LoginScreen=({onLogin})=>{
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const login=async()=>{
    setLoading(true);setErr("");
    try{
      const {auth,GoogleAuthProvider,signInWithPopup}=window.__firebase;
      const provider=new GoogleAuthProvider();
      await signInWithPopup(auth,provider);
      onLogin();
    }catch(e){setErr(e.message);setLoading(false);}
  };
  return(
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",
      alignItems:"center",justifyContent:"center",gap:24,padding:32}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48}}>💰</div>
        <div style={{fontWeight:800,fontSize:26,color:C.text,marginTop:12}}>Finance Tracker</div>
        <div style={{fontSize:14,color:C.muted,marginTop:6,maxWidth:260,lineHeight:1.5}}>
          Sign in with Google to sync your data across all devices
        </div>
      </div>
      <button onClick={login} disabled={loading} style={{
        background:"#fff",color:"#1a1a1a",border:"none",borderRadius:12,
        padding:"14px 28px",cursor:"pointer",fontWeight:700,fontSize:15,
        display:"flex",alignItems:"center",gap:10,opacity:loading?.6:1}}>
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"/>
        {loading?"Signing in…":"Continue with Google"}
      </button>
      {err&&<div style={{color:C.red,fontSize:12,textAlign:"center",maxWidth:280}}>{err}</div>}
      <div style={{fontSize:11,color:C.muted,textAlign:"center",maxWidth:260,lineHeight:1.6}}>
        Your data is private and only visible to you. Stored securely in Firebase.
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
function App(){
  const [fbReady,  setFbReady]  = useState(!!window.__firebase);
  const [user,     setUser]     = useState(null);
  const [pinOk,    setPinOk]    = useState(false);
  const [data,     setData]     = useState(EMPTY);
  const [tab,      setTab]      = useState("home");
  const [modal,    setModal]    = useState(null);
  const [form,     setForm]     = useState({});
  const [syncSt,   setSyncSt]   = useState("idle"); // idle | saving | saved | error
  const [cur,      setCur]      = useState("USD");
  const saveTimer  = useRef(null);

  // wait for firebase module
  useEffect(()=>{
    if(window.__firebase){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener("firebaseReady",h);
    return()=>window.removeEventListener("firebaseReady",h);
  },[]);

  // auth listener
  useEffect(()=>{
    if(!fbReady)return;
    const {auth,onAuthStateChanged}=window.__firebase;
    return onAuthStateChanged(auth,u=>{
      setUser(u);
      if(!u){setData(EMPTY);setPinOk(false);}
    });
  },[fbReady]);

  // load data from Firestore when user logs in
  useEffect(()=>{
    if(!user||!fbReady)return;
    const {db,doc,onSnapshot}=window.__firebase;
    const ref=doc(db,"users",user.uid,"finance","data");
    const unsub=onSnapshot(ref,snap=>{
      if(snap.exists()){
        const d=snap.data();
        setData({...EMPTY,...d});
        setCur(d.currency||"USD");
      }
    });
    return unsub;
  },[user,fbReady]);

  // save to Firestore (debounced 1.5s)
  const saveToFirestore=useCallback((d)=>{
    if(!user||!fbReady)return;
    clearTimeout(saveTimer.current);
    setSyncSt("saving");
    saveTimer.current=setTimeout(async()=>{
      try{
        const {db,doc,setDoc}=window.__firebase;
        await setDoc(doc(db,"users",user.uid,"finance","data"),d,{merge:true});
        setSyncSt("saved");
        setTimeout(()=>setSyncSt("idle"),2000);
      }catch(e){setSyncSt("error");}
    },1500);
  },[user,fbReady]);

  const update=(fn)=>{
    setData(prev=>{
      const next=fn(prev);
      saveToFirestore(next);
      return next;
    });
  };

  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const closeModal=()=>{setModal(null);setForm({});};

  // ── computed ────────────────────────────────────────────────────────────────
  const totalBank  = data.banks.reduce((s,b)=>s+b.balance,0);
  const totalUsed  = data.cards.reduce((s,c)=>s+c.used,0);
  const totalLimit = data.cards.reduce((s,c)=>s+c.limit,0);
  const totalSub   = data.subs.filter(s=>s.cycle==="Monthly").reduce((a,s)=>a+s.amount,0);
  const familyOwed = data.family.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0);
  const investVal  = data.investments.reduce((s,i)=>s+i.qty*i.buyPrice,0);
  const netWorth   = totalBank - totalUsed + investVal;

  const thisMonth  = new Date().toISOString().slice(0,7);
  const monthExp   = data.expenses.filter(e=>e.date.startsWith(thisMonth));
  const monthTotal = monthExp.reduce((s,e)=>s+e.amount,0);

  const byCat={};
  monthExp.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  const catList=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  const spendTrend=Array.from({length:6},(_,i)=>{
    const d=new Date(); d.setMonth(d.getMonth()-(5-i));
    const key=d.toISOString().slice(0,7);
    const label=d.toLocaleString("en-US",{month:"short"});
    return{month:label,worth:data.expenses.filter(e=>e.date.startsWith(key)).reduce((s,e)=>s+e.amount,0)};
  });

  const allSources=[...data.banks.map(b=>b.name),...data.cards.map(c=>c.name)];

  // ── actions ──────────────────────────────────────────────────────────────────
  const addExpense=()=>{
    if(!form.desc||!form.amount||!form.source)return;
    const amt=parseFloat(form.amount);
    const e={id:Date.now(),date:form.date||today(),desc:form.desc,
      amount:amt,cat:form.cat||"Other",source:form.source,note:form.note||""};
    update(d=>({...d,
      expenses:[e,...d.expenses],
      banks:d.banks.map(b=>b.name===form.source?{...b,balance:b.balance-amt}:b),
      cards:d.cards.map(c=>c.name===form.source?{...c,used:c.used+amt}:c),
    }));
    closeModal();
  };
  const addBank=()=>{
    if(!form.name||!form.balance)return;
    update(d=>({...d,banks:[...d.banks,{id:Date.now(),name:form.name,
      type:form.type||"checking",balance:parseFloat(form.balance),icon:"🏦"}]}));
    closeModal();
  };
  const addCard=()=>{
    if(!form.name||!form.limit)return;
    update(d=>({...d,cards:[...d.cards,{id:Date.now(),name:form.name,
      limit:parseFloat(form.limit),used:parseFloat(form.used)||0,icon:"💳"}]}));
    closeModal();
  };
  const addFamily=()=>{
    if(!form.name||!form.amount)return;
    update(d=>({...d,family:[...d.family,{id:Date.now(),name:form.name,
      amount:parseFloat(form.amount),date:form.date||today(),note:form.note||"",paid:false}]}));
    closeModal();
  };
  const addSub=()=>{
    if(!form.name||!form.amount)return;
    update(d=>({...d,subs:[...d.subs,{id:Date.now(),name:form.name,
      amount:parseFloat(form.amount),cycle:form.cycle||"Monthly",
      nextDate:form.nextDate||today(),icon:"📋"}]}));
    closeModal();
  };
  const addInvestment=()=>{
    if(!form.name||!form.buyPrice||!form.qty)return;
    update(d=>({...d,investments:[...d.investments,{
      id:Date.now(),type:form.itype||"Stock",name:form.name,
      ticker:(form.ticker||form.name).toUpperCase(),
      qty:parseFloat(form.qty),buyPrice:parseFloat(form.buyPrice),
      buyDate:form.buyDate||today(),platform:form.platform||"",
      target:parseFloat(form.target)||0,note:form.note||""
    }]}));
    closeModal();
  };
  const markFamilyPaid=(id)=>update(d=>({...d,
    family:d.family.map(f=>f.id===id?{...f,paid:true,paidDate:today()}:f)}));
  const del=(section,id)=>update(d=>({...d,[section]:d[section].filter(x=>x.id!==id)}));
  const updateBankBalance=(id,val)=>update(d=>({...d,
    banks:d.banks.map(b=>b.id===id?{...b,balance:parseFloat(val)||0}:b)}));

  const exportCSV=()=>{
    const rows=[["Date","Description","Category","Amount","Source","Note"]];
    data.expenses.forEach(e=>rows.push([e.date,e.desc,e.cat,e.amount,e.source,e.note||""]));
    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download=`finance_${today()}.csv`;a.click();
  };

  const signOutUser=async()=>{
    const {auth,signOut}=window.__firebase;
    await signOut(auth);
    setPinOk(false);
  };

  const changeCurrency=(c)=>{setCur(c);update(d=>({...d,currency:c}));};

  // ── sync indicator ───────────────────────────────────────────────────────────
  const syncColor=syncSt==="saved"?C.green:syncSt==="saving"?C.amber:syncSt==="error"?C.red:C.muted;
  const syncLabel=syncSt==="saved"?"☁ Synced":syncSt==="saving"?"⏳ Saving…":syncSt==="error"?"✗ Error":"☁ Firebase";

  // ── TABS ─────────────────────────────────────────────────────────────────────
  const TABS=[
    {id:"home",icon:"🏠",label:"Home"},
    {id:"accounts",icon:"💰",label:"Accounts"},
    {id:"expenses",icon:"📊",label:"Spend"},
    {id:"invest",icon:"📈",label:"Invest"},
    {id:"more",icon:"⋯",label:"More"},
  ];

  // ── HOME ─────────────────────────────────────────────────────────────────────
  const HomeTab=()=>(
    <div>
      <Card style={{background:"linear-gradient(135deg,#1e1b4b,#312e81)",marginBottom:12}}>
        <div style={{fontSize:11,color:"#a5b4fc",fontWeight:600}}>NET WORTH</div>
        <div style={{fontSize:34,fontWeight:800,color:"#fff"}}>{fmt(netWorth,cur)}</div>
        <div style={{fontSize:12,color:"#86efac",marginTop:4}}>
          Bank {fmt(totalBank,cur)} · Cards −{fmt(totalUsed,cur)} · Invest {fmt(investVal,cur)}
        </div>
        <div style={{fontSize:11,color:"#c4b5fd",marginTop:4}}>
          👤 {user.displayName} &nbsp;·&nbsp; {syncLabel}
        </div>
      </Card>

      {/* quick add */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>QUICK ADD</div>
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
          {(data.quickAdds||QUICK_DEFAULTS).map((q,i)=>(
            <button key={i} onClick={()=>{setForm({cat:q.cat,desc:q.label});setModal("addExpense");}}
              style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,
                padding:"8px 14px",cursor:"pointer",color:C.text,
                display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                minWidth:64,flexShrink:0}}>
              <span style={{fontSize:22}}>{q.icon}</span>
              <span style={{fontSize:10,color:C.muted}}>{q.label}</span>
            </button>
          ))}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <Card>
          <div style={{fontSize:11,color:C.muted,fontWeight:600}}>THIS MONTH</div>

        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",
            cursor:"pointer",padding:"4px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:9,fontWeight:600,color:tab===t.id?C.accent:C.muted}}>{t.label}</span>
            {tab===t.id&&<div style={{width:4,height:4,borderRadius:99,background:C.accent}}/>}
          </button>
        ))}
      </div>

      {/* modals */}
      {modal==="addExpense"&&(
        <Modal title="Add Expense" onClose={closeModal}>
          <Inp label="Description" placeholder="e.g. Gift for Dad"
            value={form.desc||""} onChange={e=>f("desc",e.target.value)}/>
          <Inp label="Amount (USD)" type="number" placeholder="0.00"
            value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Date" type="date" value={form.date||today()}
            onChange={e=>f("date",e.target.value)}/>
          <Sel label="Category" value={form.cat||""} onChange={e=>f("cat",e.target.value)}>
            <option value="">Select category</option>
            {CATS.map(c=><option key={c}>{c}</option>)}
          </Sel>
          <Sel label="Paid via" value={form.source||""} onChange={e=>f("source",e.target.value)}>
            <option value="">Select account / card</option>
            {allSources.map(s=><option key={s}>{s}</option>)}
          </Sel>
          <Inp label="Notes (optional)" textarea placeholder="e.g. Birthday gift, shipped to India"
            value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={addExpense}>Save Expense</Btn>
        </Modal>
      )}
      {modal==="addBank"&&(
        <Modal title="Add Bank Account" onClose={closeModal}>
          <Inp label="Account name" placeholder="e.g. Chase Checking"
            value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Sel label="Type" value={form.type||"checking"} onChange={e=>f("type",e.target.value)}>
            <option value="checking">Checking</option><option value="savings">Savings</option>
          </Sel>
          <Inp label="Current balance ($)" type="number"
            value={form.balance||""} onChange={e=>f("balance",e.target.value)}/>
          <Btn onClick={addBank}>Add Account</Btn>
        </Modal>
      )}
      {modal==="addCard"&&(
        <Modal title="Add Credit Card" onClose={closeModal}>
          <Inp label="Card name" placeholder="e.g. Amex Gold"
            value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Credit limit ($)" type="number"
            value={form.limit||""} onChange={e=>f("limit",e.target.value)}/>
          <Inp label="Current used ($)" type="number"
            value={form.used||""} onChange={e=>f("used",e.target.value)}/>
          <Btn onClick={addCard}>Add Card</Btn>
        </Modal>
      )}
      {modal==="addFamily"&&(
        <Modal title="Add Family Transaction" onClose={closeModal}>
          <Inp label="Person" placeholder="e.g. Mom"
            value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Amount ($)" type="number"
            value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Inp label="Date" type="date" value={form.date||today()}
            onChange={e=>f("date",e.target.value)}/>
          <Inp label="Note" placeholder="e.g. Monthly support"
            value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={addFamily}>Add</Btn>
        </Modal>
      )}
      {modal==="addSub"&&(
        <Modal title="Add Subscription" onClose={closeModal}>
          <Inp label="Service" placeholder="e.g. Netflix"
            value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Amount ($)" type="number"
            value={form.amount||""} onChange={e=>f("amount",e.target.value)}/>
          <Sel label="Billing cycle" value={form.cycle||"Monthly"} onChange={e=>f("cycle",e.target.value)}>
            <option>Monthly</option><option>Yearly</option>
          </Sel>
          <Inp label="Next billing date" type="date" value={form.nextDate||today()}
            onChange={e=>f("nextDate",e.target.value)}/>
          <Btn onClick={addSub}>Add Subscription</Btn>
        </Modal>
      )}
      {modal==="addInvestment"&&(
        <Modal title="Add Investment" onClose={closeModal}>
          <Sel label="Type" value={form.itype||"Stock"} onChange={e=>f("itype",e.target.value)}>
            <option>Stock</option><option>Crypto</option><option>ETF</option><option>Mutual Fund</option>
          </Sel>
          <Inp label="Name" placeholder="e.g. Bitcoin / Apple"
            value={form.name||""} onChange={e=>f("name",e.target.value)}/>
          <Inp label="Ticker / Symbol" placeholder="e.g. BTC, AAPL"
            value={form.ticker||""} onChange={e=>f("ticker",e.target.value)}/>
          <Inp label="Quantity" type="number" placeholder="e.g. 0.5 or 10"
            value={form.qty||""} onChange={e=>f("qty",e.target.value)}/>
          <Inp label="Buy price per unit ($)" type="number"
            value={form.buyPrice||""} onChange={e=>f("buyPrice",e.target.value)}/>
          <Inp label="Date bought" type="date" value={form.buyDate||today()}
            onChange={e=>f("buyDate",e.target.value)}/>
          <Inp label="Platform" placeholder="e.g. Coinbase, Robinhood, Zerodha"
            value={form.platform||""} onChange={e=>f("platform",e.target.value)}/>
          <Inp label="Ideal sell target ($ per unit)" type="number"
            value={form.target||""} onChange={e=>f("target",e.target.value)}/>
          <Inp label="Notes" textarea placeholder="e.g. Long hold, DCA monthly"
            value={form.note||""} onChange={e=>f("note",e.target.value)}/>
          <Btn onClick={addInvestment}>Add Investment</Btn>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
